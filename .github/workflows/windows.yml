name: 윈도우 실행

# 사용자는 윈도우에서 .bat 을 더블클릭해서 쓴다. 리눅스 테스트로는 cmd.exe·파워셸의
# 실제 동작을 확인할 수 없어서, 진짜 윈도우에서 실행 파일을 그대로 돌려본다.
on:
  push:
    paths:
      - "*.bat"
      - "program/tools/**"
      - "program/bootstrap.py"
      - "program/updater.py"
      - "program/main.py"
      - "program/requirements.txt"
      - "program/stock_analysis/app.py"
      - "program/stock_analysis/macro.py"
      - ".github/workflows/windows.yml"
  workflow_dispatch:

env:
  # 콘솔이 아니라 파이프로 받으므로 한글이 깨지지 않게(실제 창에서는 필요 없다)
  PYTHONIOENCODING: utf-8

jobs:
  launch:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 예전 판 .bat 을 꺼내 쓴다

      - name: 줄바꿈이 CRLF 그대로인지
        shell: python
        run: |
          import pathlib
          for p in list(pathlib.Path(".").glob("*.bat")) + [pathlib.Path("program/tools/python.cmd")]:
              data = p.read_bytes()
              assert b"\n" not in data.replace(b"\r\n", b""), p
              print("ok", p)

      - name: 파이썬 찾기 (tools\python.cmd)
        if: ${{ !cancelled() }}
        shell: cmd
        working-directory: program
        run: |
          call tools\python.cmd noinstall
          if not defined FS_PY exit /b 1
          echo FS_PY=%FS_PY%
          %FS_PY% -c "import sys; print(sys.executable, sys.version)"

      - name: 실행 중에 갈아끼워져도 깨끗하게 끝나는지 (예전 판 → 지금 판)
        if: ${{ !cancelled() }}
        shell: python
        run: |
          import pathlib, shutil, subprocess, sys, tempfile

          NEW = pathlib.Path("업데이트.bat").resolve().read_bytes()

          def old(rev, path):
              return subprocess.run(["git", "show", f"{rev}:{path}"], capture_output=True, check=True).stdout

          def run(old_bat, new_bat, tools=None):
              """옛 업데이트.bat 을 돌리고, 그 도중에 가짜 updater 가 새 파일로 덮어쓴다."""
              with tempfile.TemporaryDirectory() as tmp:
                  tmp = pathlib.Path(tmp)
                  (tmp / "program").mkdir()
                  bat = tmp / "update.bat"
                  bat.write_bytes(old_bat)
                  (tmp / "program" / "new.bat").write_bytes(new_bat)
                  (tmp / "program" / "updater.py").write_text(
                      "import pathlib, shutil\n"
                      "here = pathlib.Path(__file__).parent\n"
                      "shutil.copyfile(here / 'new.bat', here.parent / 'update.bat')\n"
                      "print('fake update done')\n", encoding="utf-8")
                  if tools:
                      (tmp / "program" / "tools").mkdir()
                      (tmp / "program" / "tools" / "python.cmd").write_bytes(tools)
                  r = subprocess.run(["cmd", "/c", str(bat)], stdin=subprocess.DEVNULL,
                                     capture_output=True, timeout=300)
                  return (r.stdout + r.stderr).decode("utf-8", "replace")

          v472 = old("56d806d", "업데이트.bat")
          v473 = old("2ba3631", "업데이트.bat")
          tools473 = old("2ba3631", "program/tools/python.cmd")

          # 시험이 제대로 잡는지 먼저: 4.7.2 → 4.7.3 은 실제로 깨져야 한다
          broken = run(v472, v473)
          print("--- 4.7.2 -> 4.7.3 ---\n" + broken)
          assert "fake update done" in broken
          assert "not recognized" in broken, "시험이 문제를 못 잡는다"

          for name, before, tools in (("4.7.2", v472, None), ("4.7.3", v473, tools473)):
              out = run(before, NEW, tools)
              print(f"--- {name} -> now ---\n" + out)
              assert "fake update done" in out, name
              assert "not recognized" not in out, name
              assert "Press any key" not in out, name
          print("OK")

      - name: 시작하기 → 화면이 뜨는지 (다른 컴퓨터에서 복사해 온 .venv 포함), 끄기
        if: ${{ !cancelled() }}
        shell: python
        timeout-minutes: 20
        run: |
          import pathlib, subprocess, time, urllib.request

          root = pathlib.Path(".").resolve()
          program = root / "program"
          # 다른 컴퓨터에서 폴더째 복사해 온 것처럼: 실행이 안 되는 .venv
          scripts = program / ".venv" / "Scripts"
          scripts.mkdir(parents=True)
          (scripts / "python.exe").write_bytes(b"copied from another computer")
          (program / ".venv" / "pyvenv.cfg").write_text("home = C:\\Users\\someone\\Python312\n")

          def bat(text):
              return next(p for p in root.glob("*.bat") if text.encode() in p.read_bytes())

          def up():
              try:
                  return urllib.request.urlopen("http://127.0.0.1:8765/healthz", timeout=3).read().strip() == b"ok"
              except Exception:
                  return False

          # 브라우저가 몇 번 열리는지 센다(BROWSER 를 세는 스크립트로 바꿔 둔다). 한 번이어야 한다.
          import os, tempfile
          counter_dir = pathlib.Path(tempfile.mkdtemp())
          opened = counter_dir / "opened.txt"
          (counter_dir / "count.bat").write_text(f"@echo %1>>\"{opened}\"\r\n", encoding="ascii")
          env = dict(os.environ, BROWSER=(counter_dir / "count.bat").as_posix() + " %s")
          r = subprocess.run(["cmd", "/c", str(bat("Start the watcher"))], stdin=subprocess.DEVNULL,
                             capture_output=True, timeout=1000, env=env)
          out = (r.stdout + r.stderr).decode("utf-8", "replace")
          print(out)
          log = program / "logs" / "실행기록.log"
          if log.exists():
              print("--- log ---\n" + log.read_text(encoding="utf-8", errors="replace")[-4000:])
          assert "새로 만듭니다" in out, "복사해 온 .venv 를 알아보지 못했다"
          assert "not recognized" not in out
          assert up(), "화면(대시보드)이 뜨지 않았다"
          # 앱으로 설치할 때 크롬·엣지가 읽는 것들이 윈도우에서도 그대로 나오는지
          import json as _json
          manifest = _json.loads(urllib.request.urlopen("http://127.0.0.1:8765/manifest.webmanifest", timeout=5).read())
          assert manifest["display"] == "standalone", manifest
          for icon in manifest["icons"]:
              assert urllib.request.urlopen("http://127.0.0.1:8765" + icon["src"], timeout=5).read()[:4] == b"\x89PNG", icon
          assert b"/offline" in urllib.request.urlopen("http://127.0.0.1:8765/sw.js", timeout=5).read()
          print("app manifest ok:", manifest["name"])
          time.sleep(3)                       # 뒤에서 도는 쪽이 1초 뒤에 열던 것까지 기다린다
          count = len(opened.read_text().splitlines()) if opened.exists() else 0
          print("browser opened:", count)
          assert count == 1, f"브라우저 창이 {count}번 열렸다"

          r = subprocess.run(["cmd", "/c", str(bat("Stop the background watcher"))], stdin=subprocess.DEVNULL,
                             capture_output=True, timeout=300)
          print((r.stdout + r.stderr).decode("utf-8", "replace"))
          for _ in range(30):
              if not up():
                  break
              time.sleep(1)
          assert not up(), "끄기가 멈추지 못했다"
          print("OK")

      - name: 경제 지표(기준금리 등)를 실제로 받아 오는지 — FRED
        if: ${{ !cancelled() }}
        shell: cmd
        working-directory: program
        run: |
          .venv\Scripts\python.exe -c "import tempfile; from stock_analysis.http import HttpClient; from stock_analysis.macro import MacroClient; c = MacroClient(HttpClient(user_agent='first-stock-ci'), tempfile.mkdtemp()); s = c.refresh(force=True); [print(r.spec.id, r.as_of, r.text) for r in (s.readings if s else [])]; print('error:', c.last_error or 'none'); assert s and s.get('DFEDTARU') and s.get('DGS10')"

      - name: 앱 창으로 열 브라우저 찾기 (기본 브라우저가 크롬·엣지일 때만 — 정보)
        shell: python
        working-directory: program
        run: |
          import os, sys
          os.environ.pop("BROWSER", None)
          sys.path.insert(0, ".")
          import bootstrap
          print("app browser:", repr(bootstrap.app_browser()))

      - name: 업데이트 (실제로 GitHub 에서 받아 갈아끼우기)
        if: ${{ !cancelled() }}
        shell: python
        timeout-minutes: 10
        run: |
          import pathlib, re, subprocess

          root = pathlib.Path(".").resolve()
          init = root / "program" / "stock_analysis" / "__init__.py"
          real = re.search(r'__version__ = "([^"]+)"', init.read_text(encoding="utf-8")).group(1)
          init.write_text(init.read_text(encoding="utf-8").replace(real, "0.0.1"), encoding="utf-8")

          update = next(p for p in root.glob("*.bat") if b"Update to the latest version" in p.read_bytes())
          r = subprocess.run(["cmd", "/c", str(update)], stdin=subprocess.DEVNULL,
                             capture_output=True, timeout=500)
          out = (r.stdout + r.stderr).decode("utf-8", "replace")
          print(out)
          assert "not recognized" not in out
          now = re.search(r'__version__ = "([^"]+)"', init.read_text(encoding="utf-8")).group(1)
          print("version after update:", now)
          assert now != "0.0.1", "업데이트가 파일을 갈아끼우지 못했다"

      - name: 파이썬이 없을 때 — python.org 에서 내 계정에만 설치
        if: ${{ !cancelled() }}
        shell: cmd
        timeout-minutes: 15
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File program\tools\install-python.ps1 -Target "%RUNNER_TEMP%\fs-python"
          echo installer exit code %errorlevel%
          "%RUNNER_TEMP%\fs-python\python.exe" -c "import sys, venv, ensurepip; print('installed', sys.version)"

  # 새 컴퓨터처럼: 파이썬이 하나도 없고, 'python' 은 스토어 안내용 가짜뿐이고,
  # 폴더는 한글·띄어쓰기·괄호가 든 곳(ZIP 을 두 번 받으면 'first-stock (1)')에 있다.
  fresh-pc:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: 파이썬 없이 시작하기 → 자동 설치 → 화면 → 끄기
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 1) 이 컴퓨터의 파이썬을 전부 숨긴다
          foreach ($name in 'py', 'pyw', 'python', 'python3') {
            Get-Command $name -All -ErrorAction SilentlyContinue | ForEach-Object {
              if ($_.Source -and $_.Source -notlike '*WindowsApps*') { Remove-Item $_.Source -Force -ErrorAction SilentlyContinue }
            }
          }
          foreach ($key in 'HKLM:\SOFTWARE\Python', 'HKCU:\SOFTWARE\Python', 'HKLM:\SOFTWARE\WOW6432Node\Python') {
            Remove-Item $key -Recurse -Force -ErrorAction SilentlyContinue
          }
          $env:PATH = ($env:PATH -split ';' | Where-Object { $_ -and $_ -notmatch 'Python' }) -join ';'
          # 2) 스토어 안내용 가짜 python (실행하면 안내문만 찍고 9009 로 끝난다)
          $fake = Join-Path $env:RUNNER_TEMP 'store-stub'
          New-Item -ItemType Directory -Force $fake | Out-Null
          Set-Content -Path (Join-Path $fake 'python.bat') -Encoding ascii -Value @(
            '@echo Python was not found; run without arguments to install from the Microsoft Store',
            '@exit /b 9009')
          $env:PATH = "$fake;$env:PATH"
          Write-Host "--- python lookup after hiding ---"
          Get-Command py, python -All -ErrorAction SilentlyContinue | Format-Table -AutoSize | Out-String | Write-Host

          # 3) 한글·띄어쓰기·괄호가 든 폴더로 옮긴다
          $home2 = Join-Path $env:RUNNER_TEMP '홍 길동\Downloads\first-stock (1)'
          New-Item -ItemType Directory -Force $home2 | Out-Null
          Copy-Item -Path (Join-Path $env:GITHUB_WORKSPACE '*') -Destination $home2 -Recurse -Force
          Set-Location $home2

          function Bat($text) { Get-ChildItem *.bat | Where-Object { (Get-Content $_.FullName -Raw) -match $text } | Select-Object -First 1 }
          function Up { try { (Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8765/healthz -TimeoutSec 3).Content.Trim() -eq 'ok' } catch { $false } }

          $start = Bat 'Start the watcher'
          $out = cmd /c "`"$($start.FullName)`" < NUL 2>&1" | Out-String
          Write-Host $out
          $log = Join-Path $home2 'program\logs\실행기록.log'
          if (Test-Path $log) { Write-Host '--- log ---'; Get-Content $log -Tail 40 | Write-Host }
          if ($out -match 'not recognized') { throw '모르는 명령이 실행됐다' }
          $py = Join-Path $env:LOCALAPPDATA 'FirstStock\python\python.exe'
          if (-not (Test-Path $py)) { throw '파이썬이 자동으로 설치되지 않았다' }
          if (-not (Up)) { throw '화면(대시보드)이 뜨지 않았다' }

          $stop = Bat 'Stop the background watcher'
          cmd /c "`"$($stop.FullName)`" < NUL 2>&1" | Out-String | Write-Host
          foreach ($i in 1..30) { if (-not (Up)) { break }; Start-Sleep 1 }
          if (Up) { throw '끄기가 멈추지 못했다' }
          Write-Host 'OK'
