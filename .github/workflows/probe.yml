name: 자료 출처 점검

# 프로그램이 받아 오는 곳마다, 어떤 User-Agent 로 물어야 답하는지 실제 윈도우에서 확인한다.
# (2026-10: FRED 가 '크롬인 척하는' User-Agent 를 봇으로 보고 끊어서 경제 지표가 멈췄었다)
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/probe.yml"

env:
  PYTHONIOENCODING: utf-8

jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - name: 출처 × User-Agent
        shell: python
        run: |
          import subprocess, sys, time
          subprocess.run([sys.executable, "-m", "pip", "install", "-q", "requests"], check=True)
          import requests

          CHROME = ("Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                    "(KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36")
          TOOL = requests.utils.default_user_agent()
          URLS = {
              "yahoo-chart": "https://query1.finance.yahoo.com/v8/finance/chart/AAPL?range=5d&interval=1d",
              "yahoo-chart-kr": "https://query2.finance.yahoo.com/v8/finance/chart/005930.KS?range=5d&interval=1d",
              "yahoo-rss": "https://feeds.finance.yahoo.com/rss/2.0/headline?s=AAPL&region=US&lang=en-US",
              "stooq-quote": "https://stooq.com/q/l/?s=aapl.us&f=sd2t2ohlcv&h&e=csv",
              "stooq-history": "https://stooq.com/q/d/l/?s=aapl.us&i=d",
              "fred": "https://fred.stlouisfed.org/graph/fredgraph.csv?id=DGS10&cosd=2026-09-01",
              "google-news": "https://news.google.com/rss/search?q=AAPL&hl=en-US&gl=US&ceid=US:en",
              "marketwatch": "https://feeds.content.dowjones.io/public/rss/mw_topstories",
              "cnbc": "https://search.cnbc.com/rss/2.0/id/15839135/device/rss/rss.html",
              "google-translate": "https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ko&dt=t&q=hello",
              "dart": "https://opendart.fss.or.kr/api/list.json",
          }
          for name, url in URLS.items():
              for label, ua in (("chrome", CHROME), ("tool", TOOL)):
                  t = time.time()
                  try:
                      r = requests.get(url, headers={"User-Agent": ua}, timeout=20)
                      print(f"{name:18s} {label:6s} [{r.status_code}] {time.time()-t:5.1f}s {len(r.content):7d}B {r.text[:70]!r}")
                  except Exception as exc:
                      print(f"{name:18s} {label:6s} [ERR] {time.time()-t:5.1f}s {type(exc).__name__}: {str(exc)[:90]}")

      - uses: actions/checkout@v4

      - name: 숫자 대조 — 프로그램 계산값 vs 야후 요약(가격·등락·52주·이름·배수·PER)
        shell: python
        working-directory: program
        run: |
          import subprocess, sys
          subprocess.run([sys.executable, "-m", "pip", "install", "-q", "-r", "requirements.txt"], check=True)
          sys.path.insert(0, ".")
          from stock_analysis.http import HttpClient
          from stock_analysis.prices import PriceClient
          from stock_analysis.estimates import EstimateClient
          from stock_analysis.metrics import Metrics, apply_quote
          from stock_analysis.funds import classify_name

          http = HttpClient(user_agent="ci")
          pc, est = PriceClient(http), EstimateClient(http)
          bad = []
          def off(a, b, tol=0.02):
              return a is not None and b is not None and b != 0 and abs(a / b - 1) > tol
          for t in ("SOXL", "SOXS", "TQQQ", "SQQQ", "SPY", "AAPL", "NVDA", "GOOG", "GOOGL", "TSLA", "005930.KS"):
              m = apply_quote(Metrics(ticker=t), pc, t)
              q = pc.quote(t)
              raw = (pc._live_cache.get(t) or {}).get("meta") or {}
              prof = est.profile(t)
              info = classify_name(t, q.name if q else "")
              print(f"== {t}: name={q.name if q else None!r} → {info.risk_label}")
              print(f"   price ours={m.price} yahoo={raw.get('regularMarketPrice')} | chg ours={m.price_change_pct} "
                    f"yahoo={raw.get('regularMarketChangePercent')}")
              print(f"   52w ours={m.low_52w}~{m.high_52w} yahoo={raw.get('fiftyTwoWeekLow')}~{raw.get('fiftyTwoWeekHigh')}")
              print(f"   bars={len(m.bars)} last={m.bars[-1].day if m.bars else None} | PER yahoo={getattr(prof, 'trailing_pe', None)}"
                    f" cap={getattr(prof, 'market_cap', None)}")
              if off(m.price, raw.get("regularMarketPrice"), 0.005): bad.append(f"{t} price")
              if off(m.price_change_pct, raw.get("regularMarketChangePercent"), 0.05) and abs((m.price_change_pct or 0) - (raw.get("regularMarketChangePercent") or 0)) > 0.1:
                  bad.append(f"{t} change {m.price_change_pct} vs {raw.get('regularMarketChangePercent')}")
              if off(m.high_52w, raw.get("fiftyTwoWeekHigh")): bad.append(f"{t} 52w high {m.high_52w} vs {raw.get('fiftyTwoWeekHigh')}")
              if off(m.low_52w, raw.get("fiftyTwoWeekLow")): bad.append(f"{t} 52w low {m.low_52w} vs {raw.get('fiftyTwoWeekLow')}")
              days = [b.day for b in m.bars]
              if len(days) != len(set(days)): bad.append(f"{t} 같은 날 봉이 겹침")
          # 52주 최저의 경계: 우리 값이 찍힌 날과, 1년 전 경계 근처 며칠의 저가
          import datetime as dt
          for t in ("GOOG", "GOOGL"):
              bars = pc.candles(t)
              last = bars[-1].day
              win = [b for b in bars if b.day >= last - dt.timedelta(days=366)]
              low = min(win, key=lambda b: b.low)
              print(f"{t} 최저 {low.low:.2f} @ {low.day} (마지막 {last}) | 경계 근처:",
                    [(b.day.isoformat(), round(b.low, 2)) for b in win[:4]])
          lev = {t: classify_name(t, pc.quote(t).name).high_risk for t in ("SOXL", "SOXS", "TQQQ", "SQQQ")}
          print("레버리지·인버스 판정:", lev)
          if not all(lev.values()): bad.append(f"배수 상품 판정 실패 {lev}")
          print("\n어긋난 것:", bad or "없음")

      - name: 속보 — 기본 검색어로 지금 무엇이 잡히나 (주제별 개수)
        shell: python
        working-directory: program
        run: |
          import sys, collections, types
          sys.path.insert(0, ".")
          from stock_analysis.http import HttpClient
          from stock_analysis.news import NewsWatcher, BREAKING, _spread

          state = types.SimpleNamespace(is_news_seen=lambda uid: False)
          config = types.SimpleNamespace(raw={"news": {"market": True}})
          w = NewsWatcher(HttpClient(user_agent="ci"), state, config)
          items = w.collect([])
          counts = collections.Counter(i.reasons[0] if i.reasons else "-" for i in items if i.severity >= BREAKING)
          print("속보(🚨) 주제별:", dict(counts.most_common()))
          for i in w.new_items([])[:12]:
              print(f"  [{', '.join(i.reasons)}] {i.headline[:110]} — {i.publisher}")
