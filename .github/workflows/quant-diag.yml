name: 퀀트 자료 진단(임시)

on:
  push:
    branches: ["claude/sec-edgar-monitoring-bot-5xnl1o"]
    paths:
      - ".github/workflows/quant-diag.yml"

permissions:
  contents: read

env:
  PYTHONIOENCODING: utf-8
  PYTHONUNBUFFERED: "1"

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q -r program/requirements.txt
      - name: 이름 · 태그
        working-directory: program
        shell: python
        run: |
          import sys, tempfile, collections
          from pathlib import Path
          from datetime import date
          sys.path.insert(0, ".")
          from stock_analysis.http import HttpClient
          from stock_analysis.edgar import EdgarClient
          from stock_analysis.quant.basket import name_key

          UA = "first-stock-ci github.com/tkdgusrh1/first-stock ci@example.com"
          http = HttpClient(user_agent=UA)
          edgar = EdgarClient(http, Path(tempfile.mkdtemp()))
          tm = edgar.ticker_map()
          print("XOM in map:", tm.get("XOM"), "key:", name_key(tm.get("XOM", ("", ""))[1]))
          same = [(t, c, n) for t, (c, n) in tm.items() if "exxon" in n.lower()]
          print("exxon names:", same)
          print("34088 tickers:", [(t, n) for t, (c, n) in tm.items() if int(c) == 34088])

          def facts(cik):
              return http.get_json(f"https://data.sec.gov/api/xbrl/companyfacts/CIK{cik:010d}.json", timeout=120)

          for t, cik in (("GOOG", 1652044), ("BRK-B", 1067983), ("XOM-new", 2115436)):
              try:
                  d = facts(cik)
              except Exception as e:
                  print(t, "fail", e); continue
              print("=====", t, d.get("entityName"))
              for tax in ("us-gaap", "dei"):
                  for tag, body in sorted((d.get("facts", {}).get(tax) or {}).items()):
                      if not any(w in tag for w in ("Revenue", "SharesOutstanding", "WeightedAverage", "CostOf", "GrossProfit")):
                          continue
                      for unit, rows in body.get("units", {}).items():
                          q = collections.Counter()
                          for r in rows:
                              if r.get("start"):
                                  days = (date.fromisoformat(r["end"]) - date.fromisoformat(r["start"])).days
                                  if 80 <= days <= 120:
                                      q[r["end"][:4]] += 1
                              else:
                                  q["inst-" + r["end"][:4]] += 1
                          print(f"  {tax}:{tag} [{unit}] n={len(rows)} last={max(r['end'] for r in rows)} by-year={dict(sorted(q.items()))}")
