# config.example.yml → config.yml 로 복사해서 쓰세요.
# 토큰 같은 비밀값은 환경변수(TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID)를 쓰는 걸 권장합니다.

# SEC가 요구하는 User-Agent. 반드시 연락 가능한 이메일을 넣어야 차단되지 않습니다.
user_agent: "Hong Gildong hong@example.com"

# 환경변수를 쓰면 아래 두 줄은 지워도 됩니다.
telegram_token: ""
telegram_chat_id: ""

# 감시할 폼 (전역 기본값). 종목별로 따로 지정할 수도 있습니다.
#   8-K  수시공시(실적발표·계약·경영진 변경)
#   4    내부자 거래
#   10-Q/10-K  분기·연간보고서 (본문에서 사업 설명과 MD&A 를 읽어옵니다)
#   SC 13D/G   5% 이상 대량보유
#   S-3/424B5  증자 신고 (희석 위험)
forms: ["8-K", "4", "10-Q", "10-K", "SC 13D", "SC 13G", "S-3", "424B5"]

poll_interval_sec: 900     # 감시 주기(초). SEC 부하를 생각해 5분 이상 권장
lookback_days: 3           # 재시작 시 며칠 전 공시까지 훑을지
timezone: "Asia/Seoul"
state_path: "state.json"
cache_dir: ".cache"

daily_brief_time: "08:00"  # 매일 이 시각에 휴장일·경제지표·지표 요약 전송 (끄려면 null)
econ_lookahead_days: 7
holiday_lookahead_days: 21
econ_min_importance: 2     # 1=주간 실업수당 같은 자잘한 것까지, 2=보통, 3=최상급만
econ_include_weekly: false # 매주 목요일 실업수당 청구건수 포함 여부
metrics_in_brief: true     # 브리핑에 종목 지표 한 줄 요약 포함

# 실적 발표 며칠 전에 알릴지 (0 = 당일 아침)
earnings_reminder_days: [7, 1, 0]

# 텔레그램에서 /add, /remove, /consensus 같은 명령으로 감시 목록을 고칠 수 있게 할지.
# 명령은 아래 대화방에서만 받습니다. 비워두면 알림을 보내는 telegram_chat_id 만 허용.
telegram_commands: true
allowed_chat_ids: []

# 봇이 명령으로 바꾼 내용을 저장하는 파일 (config.yml 은 그대로 둔다)
overrides_path: "watchlist.local.yml"

# 속보 감시 — 내가 찾기 전에 먼저 띄워줍니다 (무료 RSS, API 키 불필요)
news:
  enabled: true
  min_severity: 3        # 3=🚨속보만(기본), 2=🟠주목 이상, 1=전부
  market: true           # 시장 전체 뉴스(연준·물가·관세 등)도 볼지
  max_per_check: 12      # 한 번에 알릴 최대 건수
  max_age_hours: 48      # 이보다 오래된 기사는 속보로 치지 않습니다
  wire_feeds: true       # Investing.com·MarketWatch·CNBC 자체 피드도 볼지 (더 빠릅니다)
  # 매체 신뢰도로 거르기. 3=로이터·블룸버그·Investing 같은 1차 매체만,
  # 2=종합 매체까지, 1=전부(기본). 화면에는 어느 등급인지 항상 표시됩니다.
  min_publisher_tier: 1
  market_queries: []     # 비우면 기본 검색어(유가·중동·연준 긴급·서킷브레이커·관세)를 씁니다

auto_peer_count: 4       # 동종업계 자동 탐색 개수

# 영어 공시 문장에 한글을 붙입니다.
#  · 정형 표현("Revenue increased 78% ... to $213.0 million")은 규칙으로 옮깁니다.
#    이건 네트워크 없이 되고, 숫자를 손대지 않아 가장 정확합니다.
#  · 규칙에 없는 문장만 번역기로 채우고 어느 번역기가 옮겼는지 화면에 표시합니다.
# 어느 쪽이든 영어 원문은 화면에서 지우지 않습니다.
translate:
  enabled: true
  target: "ko"

  # 번역기는 믿을 수 있는 순서대로 자동으로 고릅니다.
  #   DeepL → Azure → 파파고 → Google → 무료
  # 열쇠(API 키)를 넣어둔 것만 후보가 됩니다. 하나도 없으면 무료 경로를 씁니다.
  # 특정 번역기만 쓰려면: provider: "deepl"
  provider: "auto"
  allow_free: true       # 열쇠 없는 무료 경로를 허용할지 (막힐 수 있음)

  # 열쇠는 여기 적어도 되고, 환경변수로 넣어도 됩니다(권장).
  #   DEEPL_API_KEY / AZURE_TRANSLATOR_KEY / AZURE_TRANSLATOR_REGION
  #   PAPAGO_CLIENT_ID / PAPAGO_CLIENT_SECRET / GOOGLE_TRANSLATE_API_KEY
  #
  # 어디서 받나:
  #   DeepL  https://www.deepl.com/pro-api  무료 가입, 월 50만 자
  #          금융·법률 문장에 가장 강합니다. 하나만 넣는다면 이걸 권합니다.
  #   Azure  https://portal.azure.com 에서 Translator 만들기, 월 200만 자 무료
  #   파파고  https://www.ncloud.com  한국어 표현이 가장 자연스럽습니다
  #
  # deepl_key: ""
  # azure_key: ""
  # azure_region_key: "koreacentral"
  # papago_id_key: ""
  # papago_secret_key: ""
  #
  # 어느 번역기가 실제로 되는지는 `python main.py doctor` 로 확인할 수 있습니다.

# 하루에 이만큼 넘게 움직이면 알립니다. 52주 신고가·신저가도 함께 알려줍니다.
# (같은 날 같은 사유는 한 번만 옵니다)
price_alert_pct: 7

# 내 컴퓨터에서 브라우저로 보는 화면. 내 PC(127.0.0.1)에서만 열립니다.
dashboard:
  enabled: true
  port: 8765
  open_browser: true    # 실행하면 브라우저를 자동으로 띄울지

# 발표일이 확정된 일정은 여기에 직접 넣으면 추정일 대신 이 값이 쓰입니다.
econ_extra_events:
  - date: 2026-08-12
    name: "소비자물가 CPI (7월)"
    time_et: "08:30"
    importance: 3
  # - date: 2026-08-27
  #   name: "엔비디아 실적 발표"
  #   time_et: "16:20"
  #   importance: 3

watchlist:
  # 가장 간단한 형태
  - ticker: AAPL

  # 전체 옵션
  - ticker: NVDA
    name: "엔비디아"
    forms: ["8-K", "4", "10-Q"]
    peers: ["AMD", "AVGO"]        # PER/PSR 상대 비교 대상
    consensus_eps: 1.01           # 이번 분기 EPS 컨센서스(직접 입력)
    consensus_revenue: 45000000000
    earnings_date: 2026-11-18     # 알면 지정. 없으면 과거 8-K 2.02 간격으로 추정
    note: "AI 데이터센터 비중"

  # 적자 성장주 예시 — 마일스톤을 적어두면 알림마다 같이 띄웁니다
  - ticker: RKLB
    name: "로켓랩"
    milestones:
      - "Neutron 첫 발사"
      - "분기 발사 횟수 증가"
    peers: ["ASTS"]
    # 내가 산 가격과 수량. 둘 다 넣으면 평가손익을 달러와 원화로 보여줍니다.
    # 화면의 '직접 입력' 이나 텔레그램 /buy RKLB 38.40 120 으로도 넣을 수 있습니다.
    buy_price: 38.40
    buy_shares: 120

  # ETF 도 그대로 티커만 넣으면 됩니다.
  # ETF 는 회사가 아니라 매출·ROE 가 없습니다. 대신 무엇을 담는지,
  # 배수 상품인지, 어떤 서류를 냈는지를 ETF 기준으로 보여줍니다.
  - ticker: SPY          # S&P 500 지수 추종
  - ticker: QQQ          # 나스닥 100 추종
  # - ticker: CONL       # 단일 종목 2배 레버리지 (구조 경고가 함께 뜹니다)
  # - ticker: ETHU       # 이더리움 2배 레버리지
