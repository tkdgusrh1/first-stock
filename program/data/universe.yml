# 추천 후보 목록
#
# 프로그램이 "괜찮은 종목 5개" 를 고를 때 **여기 있는 것들 중에서** 고릅니다.
# 미국 상장사는 1만 개가 넘는데, 회사 하나의 재무 원자료가 수 MB~수십 MB 라
# 전부 훑으려면 몇 GB 를 받아야 합니다. 그래서 후보를 정해두고 봅니다.
#
# 마음대로 고치셔도 됩니다. 티커만 한 줄씩 적으면 됩니다.
# config.yml 의 recommend.extra 에 적어도 후보에 들어갑니다.
# 감시 목록에 있는 종목과 자동으로 찾은 동종업계 종목도 후보에 자동 포함됩니다.
#
# 여기 있다는 것은 "좋은 종목" 이라는 뜻이 **아닙니다.** 볼 대상일 뿐이고,
# 좋고 나쁨은 프로그램이 재무제표를 받아서 판정합니다.
#
# 고른 기준: 미국 증시에서 거래가 많고 SEC 에 정기 보고서를 내는 회사들.
# 업종이 한쪽에 몰리지 않게 나눠 담았습니다.

